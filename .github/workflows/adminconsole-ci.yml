# Place at .github/workflows/adminconsole-ci.yml in the Rvssian-SEZ/Docker repo root.
# Builds on push to main when files under adminconsole/ change.
name: adminconsole-ci

on:
  push:
    branches: [main]
    paths: ["adminconsole/**"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' adminconsole/app/version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: adminconsole
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/rvssian-sez/adminconsole:latest
            ghcr.io/rvssian-sez/adminconsole:${{ steps.version.outputs.version }}
