services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=ecto://${POSTGRES_USER:-coffer}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB:-coffer}
      - SECRET_KEY_BASE
      - PHX_HOST
      - PHX_SERVER=true
      - OIDC_ISSUER
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_REDIRECT_URI
      - BASE_CURRENCY=SCR
      - STORAGE_PATH=/app/storage
    volumes:
      - app_storage:/app/storage
    ports:
      - "4000:4000"

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-coffer}
      - POSTGRES_USER=${POSTGRES_USER:-coffer}
      - POSTGRES_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coffer}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  db_data:
