<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Break-glass sign-in — {{ app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card shadow border-danger" style="width:22rem">
    <div class="card-body p-4">
      <h1 class="h5 mb-1 text-center text-danger"><i class="bi bi-exclamation-triangle-fill"></i> Break-glass access</h1>
      <p class="text-secondary small text-center mb-3">Bypasses SSO. Every login and action is alerted and logged.</p>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/login/breakglass">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">TOTP code</label>
          <input name="totp_code" class="form-control" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <button class="btn btn-danger w-100">Sign in</button>
      </form>
      <div class="text-center mt-3">
        <a href="/login" class="small text-secondary">Back to normal sign-in</a>
      </div>
    </div>
  </div>
</body>
</html>
